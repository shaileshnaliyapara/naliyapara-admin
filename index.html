<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naliyapara Notification Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,"Noto Sans Gujarati","Nirmala UI",sans-serif}
.wrap{max-width:1050px;margin:0 auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:62px;height:62px;object-fit:contain;background:white;border-radius:16px}
.brand h1{margin:0;font-size:22px}
.brand p{margin:3px 0 0;color:#64748b;font-size:13px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 28px #0f172a0b}
.login{max-width:440px;margin:70px auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 6px}
input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:11px;font:inherit}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}
.primary{background:#2563eb;color:white}
.green{background:#059669;color:white}
.danger{background:#dc2626;color:white}
.muted{background:#e2e8f0;color:#0f172a}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{font-size:34px;font-weight:900}
.small{font-size:12px;color:#64748b}
.schedule{border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-top:10px}
.badge{padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#dcfce7;color:#166534}
.off{background:#fee2e2;color:#991b1b}
.msg{padding:11px;border-radius:11px;background:#eff6ff;color:#1d4ed8;margin:10px 0}
.err{background:#fef2f2;color:#b91c1c}
.hidden{display:none!important}
@media(max-width:600px){
.wrap{padding:12px}
.top{align-items:flex-start}
.brand img{width:50px;height:50px}
}
</style>
</head>

<body>
<div id="app"></div>

<script>
const SUPABASE_URL='https://kfeaejmlshjliesrirku.supabase.co';
const SUPABASE_KEY='sb_publishable_NbvXaYkAfUJiW23t7AtVTA_TbpycKg2';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const ADMIN_FN=SUPABASE_URL+'/functions/v1/admin-notifications';
const logo='logo.png';

/* તમારા Admin email */
const ADMIN_EMAIL='shailesh.naliyapara.1@gmail.com';

let schedules=[],editing=null;

const $=id=>document.getElementById(id);

function esc(s){
return String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]))
}

function toast(t,err=false){
const x=$('toast');
if(!x)return;
x.className='msg'+(err?' err':'');
x.textContent=t;
setTimeout(()=>x.textContent='',3500)
}

async function token(){
const {data}=await sb.auth.getSession();
return data.session?.access_token||null
}

async function api(action,body={}){
const t=await token();
if(!t)throw Error('Admin login જરૂરી છે.');

const r=await fetch(ADMIN_FN,{
method:'POST',
headers:{
Authorization:'Bearer '+t,
'Content-Type':'application/json'
},
body:JSON.stringify({action,...body})
});

const d=await r.json().catch(()=>({}));

if(!r.ok||d.ok===false)
throw Error(d.error||'Request failed');

return d
}


/* =========================
   MAGIC LINK LOGIN
========================= */

function loginView(){

$('app').innerHTML=`
<div class="wrap">
<div class="card login">

<div class="brand">
<img src="${logo}">
<div>
<h1>Naliyapara Notification Admin</h1>
<p>Private notification control panel</p>
</div>
</div>

<div id="toast"></div>

<form id="login">

<label>Admin Email</label>

<input
id="email"
type="email"
autocomplete="email"
value="${ADMIN_EMAIL}"
readonly
>

<div class="actions">
<button class="primary" type="submit">
📧 Login Link મોકલો
</button>
</div>

<p class="small">
તમારા Admin email પર સુરક્ષિત Login Link મોકલવામાં આવશે.
</p>

</form>

</div>
</div>
`;

$('login').onsubmit=async e=>{
e.preventDefault();

try{

const email=$('email').value.trim().toLowerCase();

if(email!==ADMIN_EMAIL.toLowerCase()){
throw Error('આ email ને Admin access નથી.');
}

toast('📧 Login Link મોકલાઈ રહ્યું છે...');

const redirectTo=window.location.origin+window.location.pathname;

const {error}=await sb.auth.signInWithOtp({
email,
options:{
emailRedirectTo:redirectTo,
shouldCreateUser:false
}
});

if(error)throw error;

$('login').innerHTML=`
<div class="msg">
✅ Login Link તમારા email પર મોકલાઈ ગઈ છે.
<br><br>
તમારા Gmailમાં આવેલ Link પર click કરો.
<br><br>
આ page બંધ ન કરશો.
</div>
`;

}catch(e){
toast(e.message,true);
}
}
}


/* =========================
   ADMIN PANEL
========================= */

function appView(){

$('app').innerHTML=`
<div class="wrap">

<div class="top">

<div class="brand">
<img src="${logo}">
<div>
<h1>Naliyapara Notification Admin</h1>
<p>અલગ HTTPS Admin Panel • Main Websiteથી અલગ</p>
</div>
</div>

<button class="muted" id="logout">
Logout
</button>

</div>

<div id="toast"></div>

<div class="grid">

<div class="card">
<div class="small">
છેલ્લા 30 દિવસમાં active notification devices
</div>
<div class="stat" id="active">—</div>
<div class="small">
Android app heartbeat/device registration પરથી ગણાશે.
</div>
</div>

<div class="card">
<div class="small">
Schedules
</div>
<div class="stat" id="count">—</div>
<div class="small">
એકથી વધારે daily schedules બનાવી શકાય.
</div>
</div>

</div>


<div class="card">

<h2>📢 હમણાં Notification મોકલો</h2>

<p class="small">
બધા Android App Usersના <b>all_users</b> topic પર તરત notification મોકલાશે.
</p>

<form id="send">

<label>Notification Title</label>

<input id="nowTitle" value="નળીયાપરા પરિવાર">

<label>Message</label>

<textarea id="nowMsg" required placeholder="તમારો message લખો..."></textarea>

<div class="actions">

<button class="primary" type="submit">
📢 હમણાં Notification મોકલો
</button>

</div>

</form>

</div>


<div class="card">

<div class="row">

<div>
<h2>🕐 Daily Schedule</h2>
<div class="small">
દરરોજ એક જ સમય પર message મોકલવા માટે.
</div>
</div>

<button class="muted" id="newSchedule">
＋ New Schedule
</button>

</div>


<form id="scheduleForm" class="hidden">

<input type="hidden" id="sid">

<div class="grid">

<div>
<label>Title</label>
<input id="stitle" required value="નળીયાપરા પરિવાર">
</div>

<div>
<label>દરરોજનો સમય</label>
<input id="stime" type="time" required value="09:00">
</div>

</div>

<label>Message</label>

<textarea id="smsg" required></textarea>

<label>
<input id="senabled" type="checkbox" checked style="width:auto">
Schedule ચાલુ રાખો
</label>

<div class="actions">

<button class="green" type="submit">
💾 Save Schedule
</button>

<button class="muted" type="button" id="cancel">
Cancel
</button>

</div>

</form>

<div id="schedules"></div>

</div>


<div class="card">

<div class="row">

<h2>📜 Notification History</h2>

<button class="muted" id="refresh">
Refresh
</button>

</div>

<div id="history" class="small">
Loading...
</div>

</div>

</div>
`;


$('logout').onclick=async()=>{
await sb.auth.signOut();
loginView()
};

$('send').onsubmit=sendNow;

$('newSchedule').onclick=()=>{
editing=null;
$('sid').value='';
$('stitle').value='નળીયાપરા પરિવાર';
$('stime').value='09:00';
$('smsg').value='';
$('senabled').checked=true;
$('scheduleForm').classList.remove('hidden')
};

$('cancel').onclick=()=>
$('scheduleForm').classList.add('hidden');

$('scheduleForm').onsubmit=saveSchedule;

$('refresh').onclick=loadAll;

loadAll()
}


/* =========================
   SEND NOW
========================= */

async function sendNow(e){

e.preventDefault();

if(!confirm('આ notification હમણાં મોકલવી છે?'))
return;

try{

toast('મોકલાઈ રહ્યું છે...');

await api('send_now',{
title:$('nowTitle').value,
message:$('nowMsg').value
});

$('nowMsg').value='';

toast('✅ Notification સફળતાપૂર્વક મોકલાઈ.');

loadHistory();

}catch(e){

toast(e.message,true);

}
}


/* =========================
   SCHEDULE
========================= */

async function saveSchedule(e){

e.preventDefault();

try{

await api('save_schedule',{
id:$('sid').value||undefined,
title:$('stitle').value,
message:$('smsg').value,
send_time:$('stime').value,
enabled:$('senabled').checked
});

$('scheduleForm').classList.add('hidden');

toast('✅ Schedule save થયો.');

loadSchedules();

}catch(e){

toast(e.message,true);

}
}


async function loadSchedules(){

try{

const d=await api('list_schedules');

schedules=Array.isArray(d)?d:[];

$('count').textContent=schedules.length;

renderSchedules();

}catch(e){

toast(e.message,true);

}
}


function renderSchedules(){

const el=$('schedules');

if(!schedules.length){

el.innerHTML=
'<div class="small" style="padding:18px;text-align:center">હાલમાં કોઈ schedule નથી.</div>';

return;

}

el.innerHTML=schedules.map(x=>`

<div class="schedule">

<div class="row">

<div>
<b>${esc(x.title)}</b>

<span class="badge ${x.enabled?'':'off'}">
${x.enabled?'ચાલુ':'બંધ'}
</span>

</div>

<b>${esc(String(x.send_time).slice(0,5))}</b>

</div>

<div style="margin-top:8px;white-space:pre-wrap">
${esc(x.message)}
</div>

<div class="actions">

<button class="muted"
onclick="editSchedule('${x.id}')">
✏️ Edit
</button>

<button class="muted"
onclick="toggleSchedule('${x.id}',${!x.enabled})">
${x.enabled?'⏸️ બંધ':'▶️ ચાલુ'}
</button>

<button class="danger"
onclick="deleteSchedule('${x.id}')">
🗑️ Delete
</button>

</div>

</div>

`).join('')
}


window.editSchedule=id=>{

const x=schedules.find(a=>a.id===id);

if(!x)return;

$('sid').value=x.id;
$('stitle').value=x.title;
$('stime').value=String(x.send_time).slice(0,5);
$('smsg').value=x.message;
$('senabled').checked=x.enabled;

$('scheduleForm').classList.remove('hidden');

scrollTo({
top:$('scheduleForm').offsetTop-20,
behavior:'smooth'
});

};


window.toggleSchedule=async(id,en)=>{

const x=schedules.find(a=>a.id===id);

if(!x)return;

try{

await api('save_schedule',{
id,
title:x.title,
message:x.message,
send_time:String(x.send_time).slice(0,5),
enabled:en
});

toast('Schedule status બદલાયો.');

loadSchedules();

}catch(e){

toast(e.message,true);

}
};


window.deleteSchedule=async id=>{

if(!confirm('આ schedule delete કરવો છે?'))
return;

try{

await api('delete_schedule',{id});

toast('Schedule delete થયો.');

loadSchedules();

}catch(e){

toast(e.message,true);

}
};


/* =========================
   HISTORY
========================= */

async function loadHistory(){

try{

const d=await api('history');

const rows=Array.isArray(d)?d:[];

$('history').innerHTML=rows.length?

rows.map(x=>`

<div class="schedule">

<b>${esc(x.title)}</b> —
${esc(x.success?'સફળ':'ERROR')}

<br>

<span class="small">
${new Date(x.sent_at).toLocaleString('gu-IN')}
</span>

<div>
${esc(x.message)}
</div>

${x.error?
'<div style="color:#b91c1c">'+esc(x.error)+'</div>'
:''}

</div>

`).join('')

:'હજુ history નથી.';

}catch(e){

$('history').textContent=e.message

}
}


/* =========================
   LOAD ALL
========================= */

async function loadAll(){

try{

const d=await api('active_users');

$('active').textContent=d.count;

}catch(e){

$('active').textContent='0';

}

await loadSchedules();
await loadHistory();

}


/* =========================
   AUTH
========================= */

async function render(){

const {data}=await sb.auth.getSession();

if(data.session){

const email=data.session.user?.email?.toLowerCase();

if(email!==ADMIN_EMAIL.toLowerCase()){

await sb.auth.signOut();

loginView();

return;

}

appView();

}else{

loginView();

}

}


sb.auth.onAuthStateChange(()=>setTimeout(render,0));

render();

</script>

</body>
</html>
