const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const ADMIN_FN=SUPABASE_URL+'/functions/v1/admin-notifications';const logo='logo.png';let schedules=[],birthdays=[],editingBirthday=null,csvRows=[];
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t,err=false){const x=$('toast');if(!x)return;x.className='msg'+(err?' err':'');x.textContent=t;setTimeout(()=>x.textContent='',4500)}async function token(){const {data}=await sb.auth.getSession();return data.session?.access_token||null}async function api(action,body={}){

 try{

 }

<div class="card" style="margin:14px 0 0;background:#f8fafc"><h3 style="margin-top:0">📥 Bulk CSV Upload</h3><div class="small">CSV columns: <b>name,village,birth_date</b> • date format: <b>YYYY-MM-DD</b>. Duplicate contacts automatic skip થશે.</div><div class="actions"><button class="muted" id="templateBtn" type="button">⬇️ CSV Template</button><label style="display:inline-block;margin:0"><input id="csvFile" type="file" accept=".csv,text/csv" style="display:none"><button class="primary" type="button" id="csvBtn">📥 CSV પસંદ કરો</button></label></div><div id="csvPreview" class="hidden" style="margin-top:12px"></div></div>

$('logout').onclick=async()=>{await sb.auth.signOut();loginView()};$('send').onsubmit=sendNow;$('newSchedule').onclick=()=>{ $('sid').value='';$('stitle').value='નળીયાપરા પરિવાર';$('stime').value='09:00';$('smsg').value='';$('senabled').checked=true;$('scheduleForm').classList.remove('hidden')};$('cancel').onclick=()=>$('scheduleForm').classList.add('hidden');$('scheduleForm').onsubmit=saveSchedule;$('refresh').onclick=loadAll;$('newBirthday').onclick=()=>showBirthdayForm();$('bcancel').onclick=()=>$('birthdayForm').classList.add('hidden');$('birthdayForm').onsubmit=saveBirthday;$('templateBtn').onclick=downloadTemplate;$('csvBtn').onclick=()=>$('csvFile').click();$('csvFile').onchange=handleCsv;$('brefresh').onclick=loadBirthdayHistory;loadAll()}
async function sendNow(e){e.preventDefault();if(!confirm('આ notification હમણાં મોકલવી છે?'))return;try{toast('મોકલાઈ રહ્યું છે...');await api('send_now',{title:$('nowTitle').value,message:$('nowMsg').value});$('nowMsg').value='';toast('✅ Notification સફળતાપૂર્વક મોકલાઈ.');loadHistory()}catch(e){toast(e.message,true)}}
async function saveSchedule(e){e.preventDefault();try{await api('save_schedule',{id:$('sid').value||undefined,title:$('stitle').value,message:$('smsg').value,send_time:$('stime').value,enabled:$('senabled').checked});$('scheduleForm').classList.add('hidden');toast('✅ Schedule save થયો.');loadSchedules()}catch(e){toast(e.message,true)}}
async function loadSchedules(){try{const d=await api('list_schedules');schedules=Array.isArray(d)?d:[];$('count').textContent=schedules.length;renderSchedules()}catch(e){toast(e.message,true)}}function renderSchedules(){const el=$('schedules');if(!schedules.length){el.innerHTML='<div class="small" style="padding:18px;text-align:center">હાલમાં કોઈ schedule નથી.</div>';return}el.innerHTML=schedules.map(x=>`<div class="schedule"><div class="row"><div><b>${esc(x.title)}</b> <span class="badge ${x.enabled?'':'off'}">${x.enabled?'ચાલુ':'બંધ'}</span></div><b>${esc(String(x.send_time).slice(0,5))}</b></div><div style="margin-top:8px;white-space:pre-wrap">${esc(x.message)}</div><div class="actions"><button class="muted" onclick="editSchedule('${x.id}')">✏️ Edit</button><button class="muted" onclick="toggleSchedule('${x.id}',${!x.enabled})">${x.enabled?'⏸️ બંધ':'▶️ ચાલુ'}</button><button class="danger" onclick="deleteSchedule('${x.id}')">🗑️ Delete</button></div></div>`).join('')}
window.editSchedule=id=>{const x=schedules.find(a=>a.id===id);if(!x)return;$('sid').value=x.id;$('stitle').value=x.title;$('stime').value=String(x.send_time).slice(0,5);$('smsg').value=x.message;$('senabled').checked=x.enabled;$('scheduleForm').classList.remove('hidden');scrollTo({top:$('scheduleForm').offsetTop-20,behavior:'smooth'})};window.toggleSchedule=async(id,en)=>{const x=schedules.find(a=>a.id===id);if(!x)return;try{await api('save_schedule',{id,title:x.title,message:x.message,send_time:String(x.send_time).slice(0,5),enabled:en});toast('Schedule status બદલાયો.');loadSchedules()}catch(e){toast(e.message,true)}};window.deleteSchedule=async id=>{if(!confirm('આ schedule delete કરવો છે?'))return;try{await api('delete_schedule',{id});toast('Schedule delete થયો.');loadSchedules()}catch(e){toast(e.message,true)}};
async function loadHistory(){try{const d=await api('history');const rows=Array.isArray(d)?d:[];$('history').innerHTML=rows.length?rows.map(x=>`<div class="schedule"><b>${esc(x.title)}</b> — ${esc(x.success?'સફળ':'ERROR')}<br><span class="small">${new Date(x.sent_at).toLocaleString('gu-IN')}</span><div>${esc(x.message)}</div>${x.error?'<div style="color:#b91c1c">'+esc(x.error)+'</div>':''}</div>`).join(''):'હજુ history નથી.'}catch(e){$('history').textContent=e.message}}
function showBirthdayForm(x=null){editingBirthday=x?.id||null;$('bid').value=x?.id||'';$('bname').value=x?.name||'';$('bvillage').value=x?.village||'';$('bdate').value=x?.birth_date||'';$('bactive').checked=x?x.active!==false:true;$('birthdayForm').classList.remove('hidden');scrollTo({top:$('birthdayForm').offsetTop-20,behavior:'smooth'})}
async function saveBirthday(e){

async function loadBirthdays(){try{const d=await api('list_birthdays');birthdays=Array.isArray(d)?d:[];$('bcount').textContent=birthdays.length;renderBirthdays()}catch(e){toast(e.message,true)}}
function renderBirthdays(){const el=$('birthdays');if(!birthdays.length){el.innerHTML='<div class="small" style="padding:18px;text-align:center">હજુ કોઈ Birthday contact નથી.</div>';return}el.innerHTML=`<div class="tableWrap"><table class="btable"><thead><tr><th>નામ</th><th>ગામ</th><th>જન્મ તારીખ</th><th>Status</th><th>Actions</th></tr></thead><tbody>${birthdays.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.village)}</td><td>${esc(x.birth_date)}</td><td><span class="badge ${x.active?'':'off'}">${x.active?'ચાલુ':'બંધ'}</span></td><td><div class="actions" style="margin-top:0"><button class="muted" onclick='editBirthday(${JSON.stringify(x).replace(/'/g,"&#39;")})'>✏️ Edit</button><button class="primary" onclick="sendBirthdayNow('${x.id}')">🎂 Test Send</button><button class="danger" onclick="deleteBirthday('${x.id}')">🗑️ Delete</button></div></td></tr>`).join('')}</tbody></table></div>`}

function parseCsv(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(v=>v.trim()!==''))rows.push(row);row=[]}else cell+=c}if(cell!==''||row.length){row.push(cell);if(row.some(v=>v.trim()!==''))rows.push(row)}return rows}
function normalizeDate(v){const s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return s}
function parseBirthdayCsv(text){const raw=parseCsv(text);if(raw.length<2)throw Error('CSVમાં data rows નથી.');const headers=raw[0].map(x=>x.trim().toLowerCase());const ni=headers.indexOf('name'),vi=headers.indexOf('village'),di=headers.indexOf('birth_date');if(ni<0||vi<0||di<0)throw Error('CSV header exactly name,village,birth_date હોવો જોઈએ.');return raw.slice(1).map((r,i)=>({line:i+2,name:String(r[ni]||'').trim(),village:String(r[vi]||'').trim(),birth_date:normalizeDate(r[di])})).filter(r=>r.name||r.village||r.birth_date)}
async function handleCsv(e){const file=e.target.files?.[0];if(!file)return;try{const text=await file.text();csvRows=parseBirthdayCsv(text);const bad=csvRows.filter(r=>!r.name||!r.village||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(r.birth_date));$('csvPreview').classList.remove('hidden');$('csvPreview').innerHTML=`<div class="countline">${csvRows.length} rows તૈયાર છે • ${bad.length} rowsમાં validation issue</div><div class="preview">${csvRows.slice(0,30).map(r=>`Line ${r.line}: ${r.name} | ${r.village} | ${r.birth_date}${(!r.name||!r.village||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(r.birth_date))?'  ⚠️':''}`).join('\n')}</div><div class="actions"><button class="green" id="importCsvBtn" type="button">✅ Import ${csvRows.length} Rows</button></div>`;$('importCsvBtn').onclick=importCsv}catch(err){toast(err.message,true)}}
async function importCsv(){if(!csvRows.length)return;if(!confirm(`${csvRows.length} CSV rows import કરવી છે? Duplicate rows automatic skip થશે.`))return;try{toast('CSV import શરૂ...');let total=0,skip=0,fail=0;for(let i=0;i<csvRows.length;i+=100){const d=await api('import_birthdays',{rows:csvRows.slice(i,i+100)});total+=d.imported||0;skip+=d.skipped||0;fail+=d.failed||0}toast(`✅ Import complete: ${total} ઉમેરાયા, ${skip} duplicate skip, ${fail} failed.`);csvRows=[];$('csvPreview').classList.add('hidden');$('csvFile').value='';loadBirthdays()}catch(e){toast(e.message,true)}}
function downloadTemplate(){const csv='name,village,birth_date\nમહેશ નળીયાપરા,નળીયાપરા,1990-09-10\nરમેશ નળીયાપરા,અમદાવાદ,1985-09-15\nસુરેશ નળીયાપરા,રાજકોટ,1992-09-20\n';const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='naliyapara-birthday-template.csv';a.click()}
async function loadBirthdayHistory(){try{const d=await api('birthday_history');const rows=Array.isArray(d)?d:[];$('birthdayHistory').innerHTML=rows.length?rows.map(x=>{const b=x.birthday_contacts||{};return `<div class="schedule"><b>${esc(b.name||'')}</b> (${esc(b.village||'')}) — ${esc(x.success?'સફળ':'ERROR')}<br><span class="small">${new Date(x.sent_at).toLocaleString('gu-IN')} • Year ${esc(x.birthday_year)}</span><div>${esc(x.message)}</div>${x.error?'<div style="color:#b91c1c">'+esc(x.error)+'</div>':''}</div>`}).join(''):'હજુ birthday notification history નથી.'}catch(e){$('birthdayHistory').textContent=e.message}}
async function loadAll(){try{const d=await api('active_users');$('active').textContent=d.count}catch(e){$('active').textContent='0'}await loadSchedules();await loadBirthdays();await loadHistory();await loadBirthdayHistory()}
async function render(){const {data}=await sb.auth.getSession();if(data.session)appView();else loginView()}sb.auth.onAuthStateChange(()=>setTimeout(render,0));render();
</script></body></html>
